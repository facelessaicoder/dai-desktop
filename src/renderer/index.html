<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
    <title>Dataspheres AI</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Deep ocean blue — keep in sync with color.base in tokens.ts */
        background: #0A1622;
        font-family: "Geist", "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        /* Warm cream — keep in sync with color.textPrimary */
        color: #F7F0E1;
      }
      /* Custom scrollbar — gold-tinted */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(212, 162, 76, 0.22); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(212, 162, 76, 0.38); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
